plugins {
	id 'fabric-loom' version '1.0.+'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven { url = "https://mvn.devos.one/snapshots/" }
	maven { url = "https://mvn.devos.one/releases/" }
	maven { url = "https://maven.tterrag.com/" }
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://cursemaven.com" }
	maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
	maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" }
	maven {
		url = "https://jitpack.io/"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Create Fabric Astral-verified pin (JiJ Flywheel 0.6.10-39; do NOT pin 0.6.4)
	modImplementation("com.simibubi.create:create-fabric-1.18.2:${project.create_version}") {
		transitive = false
	}
	// Fallback: modImplementation("curse.maven:create-fabric-624165:5245230")
	// Optional Flywheel types: com.jozufozu.flywheel:flywheel-fabric-1.18.2:0.6.10-39
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
